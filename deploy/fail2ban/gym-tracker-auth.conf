# Install: /etc/fail2ban/filter.d/gym-tracker-auth.conf
#
# Matches the app's structured JSON log lines. The event names are deliberately stable
# strings in src/logger.js - if you rename them, this filter silently stops matching
# while still reporting itself as enabled, which is the same trap as fail2ban's default
# auth.log backend on a journal-only system.

[Definition]
failregex = ^.*"event":"login_failed","ip":"<HOST>".*$
            ^.*"event":"invalid_session","ip":"<HOST>".*$
            ^.*"event":"webhook_rejected","ip":"<HOST>".*$
            ^.*"event":"cross_origin_rejected","ip":"<HOST>".*$

ignoreregex =

[Init]
journalmatch = _SYSTEMD_UNIT=gym-tracker.service
